# Each command is passed to the platform shell and runs from the workspace.
# Commands run in the order shown and stop on failure.

# Global commands apply when a workspace does not have its own commands.
verify: []

# Example global configuration:
# verify:
#   - go test ./...
#   - go vet ./...

# Workspace commands override the global commands.
# Quote Windows paths with single quotes.
workspaces: {}

# Example workspace configuration:
# workspaces:
#   '/absolute/path/to/project':
#     verify:
#       - npm test
#       - npm run lint
